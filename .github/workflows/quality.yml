# Tests du dispositif horn-dev (scripts PowerShell exécutés sur les projets synthétiques) et recherche de secrets.
# Non exécuté tant que le dépôt n'est pas poussé sur GitHub.
name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests du dispositif (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          CI: "true"
      - name: Rapports de test
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports-dev
          path: reports/dev/
          if-no-files-found: ignore

  secrets:
    name: Recherche de secrets (Gitleaks, sorties masquées)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Limite connue : au tout premier push d'un dépôt, l'action demande l'intervalle "<commit racine>^..<head>" ;
      # le commit racine n'ayant pas de parent, Git répond "unknown revision" et le job échoue (code 1, scan partiel).
      # Constaté le 2026-09-22 sur ce dépôt ; l'historique complet avait été scanné localement (horn-check, profil full).
      # Les pushes suivants partent d'un commit avec parent et fonctionnent.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Dépôt d'organisation : ajouter GITLEAKS_LICENSE (gratuite sur gitleaks.io).
